name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install isolated runner dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate repository, utilities and adapter contracts
        run: python -B tools/validation/run_checks.py
      - name: Exercise the synthetic evaluation CLI
        run: >-
          python -B benchmarks/evaluation/trajectory.py evaluate
          --estimate examples/trajectory-evaluation/estimate.csv
          --reference examples/trajectory-evaluation/reference.csv
          --metadata examples/trajectory-evaluation/metadata.json
          --output outputs/ci-fixture
